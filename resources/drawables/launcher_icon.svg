<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="24" height="24" rx="4" fill="#1a1a1a"/>

  <!-- Calendar base grid -->
  <g stroke="#F4F4F4" stroke-width="1" fill="none">
    <!-- Top row - calendar grid -->
    <rect x="2" y="3" width="6" height="5" rx="0.5"/>
    <rect x="9" y="3" width="6" height="5" rx="0.5"/>

    <!-- Vertical divider in top section -->
    <line x1="8" y1="3" x2="8" y2="8"/>

    <!-- Bottom section - four quarters (Tetraism concept) -->
    <rect x="2" y="10" width="5" height="5" rx="0.5" stroke="#F4F4F4"/>
    <rect x="8" y="10" width="5" height="5" rx="0.5" stroke="#F4F4F4"/>
    <rect x="14" y="10" width="4" height="5" rx="0.5" stroke="#F4F4F4"/>

    <rect x="2" y="16" width="5" height="5" rx="0.5" stroke="#F4F4F4"/>
    <rect x="8" y="16" width="5" height="5" rx="0.5" stroke="#F4F4F4"/>
    <rect x="14" y="16" width="4" height="5" rx="0.5" stroke="#F4F4F4"/>
  </g>

  <!-- Tetraism accent - triangle in top right quarter -->
  <g fill="#FF6B6B" opacity="0.9">
    <polygon points="15,3 21,3 18,8"/>
  </g>

  <!-- Calendar date indicator -->
  <text x="5" y="7" font-family="Arial, sans-serif" font-size="3" font-weight="bold" fill="#F4F4F4" text-anchor="middle">8</text>

  <!-- Decorative dots for Tetraism theme -->
  <circle cx="19" cy="13" r="0.6" fill="#4ECDC4" opacity="0.8"/>
  <circle cx="19" cy="19" r="0.6" fill="#45B7AA" opacity="0.8"/>
</svg>
